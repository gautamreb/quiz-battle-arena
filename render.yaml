services:
  - type: web
    name: quiz-battle-arena
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-battle-arena-db
          property: connectionString

databases:
  - name: quiz-battle-arena-db
    databaseName: quiz_battle_arena
    user: arena
    plan: free
    region: singapore
    ipAllowList: []
